<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense-Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Ledger</h1>
      <div class="input-field">
        <input type="text" placeholder="Cofee, taxi, rent..." id="item" />
        <input type="number" placeholder="0.00" id="amount" />
        <button>Add</button>
      </div>
      <div class="entries">
        <p>Entries</p>
        <div class="sub-entry">
          <p>Coffee</p>
          <div class="sep">
            <p>$12</p>
            <p id="del">Delete</p>
          </div>
        </div>
      </div>
      <hr>
      <div class="result">
        <p>Total Spent</p>
        <h5>$16.50</h5>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
